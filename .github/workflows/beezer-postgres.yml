# Publishes ghcr.io/beezer-pet/postgresql:<PG_VERSION>, the Postgres image of
# server/dev-postgres/Dockerfile, for amd64 and arm64. Runs when that folder
# changes on self-hosted, or by hand.

name: Beezer Postgres image

on:
  push:
    branches: [self-hosted]
    paths:
      - server/dev-postgres/**
      - .github/workflows/beezer-postgres.yml
  workflow_dispatch:

concurrency:
  group: beezer-postgres
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/beezer-pet/postgresql
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the Postgres version
        id: version
        run: |
          version=$(sed -n 's/^ARG PG_VERSION=//p' server/dev-postgres/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server/dev-postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/beezer-pet/instant
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
